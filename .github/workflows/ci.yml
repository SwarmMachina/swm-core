name: CI

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - master
  workflow_dispatch:
    inputs:
      classify_release_scope:
        description: Classify changes from the previous release tag and dry-run the matching release path
        required: false
        default: false
        type: boolean
      swm_uws_ref:
        description: Optional swm-uws release-candidate branch or tag
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      requires_performance: ${{ steps.release_scope.outputs.requires_performance }}

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Setup pnpm
        if: startsWith(github.ref, 'refs/tags/v') || inputs.classify_release_scope == true
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.20.0

      - name: Verify workflow commit belongs to master
        if: github.event_name != 'pull_request'
        run: git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/master

      - name: Setup release policy runtime
        if: startsWith(github.ref, 'refs/tags/v') || inputs.classify_release_scope == true
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'

      - name: Install release policy dependencies
        if: startsWith(github.ref, 'refs/tags/v') || inputs.classify_release_scope == true
        run: pnpm install --frozen-lockfile

      - name: Verify release tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: pnpm release:verify-tag "$GITHUB_REF_NAME"

      - name: Build release policy scripts for a manual dry run
        if: inputs.classify_release_scope == true && startsWith(github.ref, 'refs/tags/v') == false
        run: pnpm build:scripts

      - name: Classify release performance scope
        id: release_scope
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* || "${{ inputs.classify_release_scope }}" == "true" ]]; then
            requires_performance="$(node .scripts-dist/release-performance-scope.js "$GITHUB_SHA")"
          else
            requires_performance=false
          fi

          case "$requires_performance" in
            true|false) ;;
            *)
              echo "invalid release performance scope: $requires_performance" >&2
              exit 1
              ;;
          esac

          echo "requires_performance=$requires_performance" >> "$GITHUB_OUTPUT"

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: source-policy
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22', '24']
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.20.0

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Resolve swm-uws candidate ref
        if: matrix.node-version == '22'
        id: binding-candidate
        run: |
          ref="$INPUT_SWM_UWS_REF"
          if [ -z "$ref" ]; then
            ref="v$(node -p 'require("./package.json").dependencies["@swarmmachina/swm-uws"]')"
          fi
          case "$ref" in
            *$'\n'*|*$'\r'*|*' '*|*'~'*|*'^'*|*':'*|*'?'*|*'['*|*'\\'*|..*|*..)
              echo "invalid swm-uws ref" >&2
              exit 1
              ;;
          esac
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
        env:
          INPUT_SWM_UWS_REF: ${{ inputs.swm_uws_ref }}

      - name: Formatting and lint
        if: matrix.node-version == '22'
        run: pnpm check

      - name: Unit tests
        run: pnpm test

      - name: Packed consumer type resolution
        if: matrix.node-version == '22'
        run: pnpm test:types

      - name: Package metadata and contents
        if: matrix.node-version == '22'
        run: pnpm test:package

      - name: HTTP e2e tests
        run: pnpm test:e2e:http

      - name: WS e2e tests
        run: pnpm test:e2e:ws

      - name: uWebSockets.js reference binding compatibility
        run: pnpm test:e2e:uwebsockets-reference

      - name: Checkout swm-uws candidate
        if: matrix.node-version == '22'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: SwarmMachina/swm-uws
          ref: ${{ steps.binding-candidate.outputs.ref }}
          path: .runtime-candidate/swm-uws

      - name: Build swm-uws candidate from source
        if: matrix.node-version == '22'
        working-directory: .runtime-candidate/swm-uws
        run: npm ci && npm run build:native

      - name: swm-uws release-candidate runtime compatibility
        if: matrix.node-version == '22'
        run: pnpm test:e2e:binding-candidate
        env:
          SWM_UWS_CANDIDATE: ${{ github.workspace }}/.runtime-candidate/swm-uws

  swm-uws-bookworm:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: source-policy
    container: node:24-bookworm
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.20.0

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: swm-uws runtime on production image
        run: pnpm test:e2e

  regression-gate:
    runs-on:
      group: swm-ci
      labels: bench
    timeout-minutes: 60
    needs: [source-policy, test, swm-uws-bookworm]
    if: github.event_name != 'pull_request' && needs['source-policy'].outputs.requires_performance == 'true'
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.20.0

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Regression profile
        run: pnpm profile:ci

      - name: Upload regression profiles
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: regression-profiles
          path: benchmark/profiles/regression-ci/

      - name: Native binding performance gate
        run: pnpm bench:bindings

      - name: Upload binding comparison
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: binding-comparison
          path: benchmark/profiles/binding-compare/

      - name: Framework comparison
        run: pnpm profile:compare

      - name: Upload framework comparison
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: framework-comparison
          path: benchmark/profiles/compare-ci/

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [source-policy, test, swm-uws-bookworm, regression-gate]
    if: >-
      always() &&
      needs['source-policy'].result == 'success' &&
      needs.test.result == 'success' &&
      needs['swm-uws-bookworm'].result == 'success' &&
      (needs['regression-gate'].result == 'success' || needs['regression-gate'].result == 'skipped')
    permissions:
      contents: read
    outputs:
      artifact_sha256: ${{ steps.release-artifact.outputs.sha256 }}

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.20.0

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build immutable release artifact
        run: pnpm release:artifact

      - name: Record release artifact digest
        id: release-artifact
        run: echo "sha256=$(node -p 'JSON.parse(require("node:fs").readFileSync("release-artifact/release-manifest.json", "utf8")).sha256')" >> "$GITHUB_OUTPUT"

      - name: Upload release artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-package
          path: release-artifact/
          if-no-files-found: error

  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: package
    if: >-
      always() &&
      needs.package.result == 'success' &&
      startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      id-token: write
    environment: npm-publish

    steps:
      - name: Checkout trusted release commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.20.0

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install trusted publisher dependencies
        run: pnpm install --frozen-lockfile

      - name: Build trusted publisher
        run: pnpm build:scripts

      - name: Download verified release artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-package
          path: release-artifact/

      - name: Verify release artifact against package-job digest
        working-directory: release-artifact
        run: |
          sha256sum --check SHA256SUMS
          actual="$(node -p 'JSON.parse(require("node:fs").readFileSync("release-manifest.json", "utf8")).sha256')"
          test "$actual" = "${{ needs.package.outputs.artifact_sha256 }}"

      - name: Publish
        run: node .scripts-dist/publish-release-artifact.js
        env:
          RELEASE_ARTIFACT_DIR: ${{ github.workspace }}/release-artifact
