name: CI

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      swm_uws_ref:
        description: Optional swm-uws release-candidate branch or tag
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup pnpm
        if: startsWith(github.ref, 'refs/tags/v')
        uses: pnpm/action-setup@v4
        with:
          version: 11.3.0

      - name: Verify workflow commit belongs to master
        run: git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/master

      - name: Setup release policy runtime
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Verify release tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: pnpm release:verify-tag "$GITHUB_REF_NAME"

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: source-policy
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22', '24']
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.3.0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Resolve swm-uws candidate ref
        if: matrix.node-version == '22'
        id: binding-candidate
        run: |
          ref="${{ inputs.swm_uws_ref }}"
          if [ -z "$ref" ]; then
            ref="v$(node -p 'require("./package.json").dependencies["@swarmmachina/swm-uws"]')"
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Formatting and lint
        if: matrix.node-version == '22'
        run: pnpm check

      - name: Unit tests
        run: pnpm test

      - name: Packed consumer type resolution
        if: matrix.node-version == '22'
        run: pnpm test:types

      - name: Package metadata and contents
        if: matrix.node-version == '22'
        run: pnpm test:package

      - name: HTTP e2e tests
        run: pnpm test:e2e:http

      - name: WS e2e tests
        run: pnpm test:e2e:ws

      - name: uWebSockets.js reference binding compatibility
        run: pnpm test:e2e:uwebsockets-reference

      - name: Checkout swm-uws candidate
        if: matrix.node-version == '22'
        uses: actions/checkout@v6
        with:
          repository: SwarmMachina/swm-uws
          ref: ${{ steps.binding-candidate.outputs.ref }}
          path: .runtime-candidate/swm-uws

      - name: Build swm-uws candidate from source
        if: matrix.node-version == '22'
        working-directory: .runtime-candidate/swm-uws
        run: npm ci && npm run build:native

      - name: swm-uws release-candidate runtime compatibility
        if: matrix.node-version == '22'
        run: pnpm test:e2e:binding-candidate
        env:
          SWM_UWS_CANDIDATE: ${{ github.workspace }}/.runtime-candidate/swm-uws

  swm-uws-bookworm:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: source-policy
    container: node:24-bookworm
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.3.0

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: swm-uws runtime on production image
        run: pnpm test:e2e

  regression-gate:
    runs-on:
      group: swm-ci
      labels: bench
    timeout-minutes: 60
    needs: [test, swm-uws-bookworm]
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.3.0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Regression profile
        run: pnpm profile:ci

      - name: Upload regression profiles
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: regression-profiles
          path: benchmark/profiles/regression-ci/

      - name: Native binding performance gate
        run: pnpm bench:bindings

      - name: Upload binding comparison
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: binding-comparison
          path: benchmark/profiles/binding-compare/

      - name: Framework comparison
        run: pnpm profile:compare

      - name: Upload framework comparison
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: framework-comparison
          path: benchmark/profiles/compare-ci/

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: regression-gate
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.3.0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Build immutable release artifact
        run: pnpm release:artifact

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-package
          path: release-artifact/
          if-no-files-found: error

  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: package
    if: success() && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Download verified release artifact
        uses: actions/download-artifact@v4
        with:
          name: release-package
          path: release-artifact/

      - name: Verify release artifact checksum
        working-directory: release-artifact
        run: sha256sum --check SHA256SUMS

      - name: Publish
        run: node release-artifact/publish-release-artifact.js
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
