name: CI

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify workflow commit belongs to master
        run: git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/master

      - name: Setup release policy runtime
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Verify release tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm run release:verify-tag -- "$GITHUB_REF_NAME"

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: source-policy
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22', '24']
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Formatting and lint
        if: matrix.node-version == '22'
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: HTTP e2e tests
        run: npm run test:e2e:http

      - name: HTTP e2e tests (node backend)
        run: npm run test:e2e:http:node

      - name: WS e2e tests
        run: npm run test:e2e:ws

      - name: WS e2e tests (node backend)
        run: npm run test:e2e:ws:node

      - name: uWebSockets.js reference binding compatibility
        run: npm run test:e2e:uwebsockets-reference

  swm-uws-bookworm:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: source-policy
    container: node:24-bookworm
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install
        run: npm ci

      - name: swm-uws runtime on production image
        run: npm run test:e2e

  regression-gate:
    runs-on:
      group: swm-ci
      labels: bench
    timeout-minutes: 60
    needs: [test, swm-uws-bookworm]
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install
        run: npm ci

      - name: Regression profile
        run: npm run profile:ci

      - name: Upload regression profiles
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-profiles
          path: benchmark/profiles/regression-ci/

      - name: Native binding performance gate
        run: npm run bench:bindings

      - name: Upload binding comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: binding-comparison
          path: benchmark/profiles/binding-compare/

      - name: Framework comparison
        run: npm run profile:compare

      - name: Upload framework comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: framework-comparison
          path: benchmark/profiles/compare-ci/

      - name: Autobahn RFC 6455 conformance (node backend)
        run: npm run test:autobahn

      - name: Upload Autobahn report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autobahn-report
          path: tests/autobahn/reports/

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: regression-gate
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Build immutable release artifact
        run: npm run release:artifact

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-package
          path: release-artifact/
          if-no-files-found: error

  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: package
    if: success() && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read

    steps:
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Download verified release artifact
        uses: actions/download-artifact@v4
        with:
          name: release-package
          path: release-artifact/

      - name: Verify release artifact checksum
        working-directory: release-artifact
        run: sha256sum --check SHA256SUMS

      - name: Publish
        run: node release-artifact/publish-release-artifact.js
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
