name: CI

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify workflow commit belongs to master
        run: git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/master

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: source-policy
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22', '24']
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: HTTP e2e tests
        run: npm run test:e2e:http

      - name: HTTP e2e tests (node backend)
        run: npm run test:e2e:http:node

      - name: WS e2e tests
        run: npm run test:e2e:ws

      - name: WS e2e tests (node backend)
        run: npm run test:e2e:ws:node

      - name: uWebSockets.js reference binding compatibility
        run: npm run test:e2e:uwebsockets-reference

  swm-uws-bookworm:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: source-policy
    container: node:24-bookworm
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install
        run: npm ci

      - name: swm-uws runtime on production image
        run: npm run test:e2e

  autobahn:
    runs-on:
      group: swm-ci
      labels: bench
    timeout-minutes: 30
    needs: [test, swm-uws-bookworm]
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install
        run: npm ci

      - name: Autobahn RFC 6455 conformance (node backend)
        run: npm run test:autobahn

      - name: Upload Autobahn report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autobahn-report
          path: tests/autobahn/reports/

  compare-http:
    runs-on:
      group: swm-ci
      labels: bench
    timeout-minutes: 15
    needs: autobahn
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install
        run: npm ci

      - name: Framework comparison (http)
        run: npm run profile:compare:http

      - name: Upload http comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compare-http
          path: benchmark/profiles/compare-ci/

  compare-ws:
    runs-on:
      group: swm-ci
      labels: bench
    timeout-minutes: 10
    needs: compare-http
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install
        run: npm ci

      - name: Framework comparison (ws)
        run: npm run profile:compare:ws

      - name: Upload ws comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compare-ws
          path: benchmark/profiles/compare-ci/

  regression-profile:
    runs-on:
      group: swm-ci
      labels: bench
    timeout-minutes: 20
    needs: compare-ws
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install
        run: npm ci

      - name: Regression profile
        run: npm run profile:ci

      - name: Upload regression profiles
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-profiles
          path: benchmark/profiles/regression-ci/

  binding-performance-gate:
    runs-on:
      group: swm-ci
      labels: bench
    timeout-minutes: 15
    needs: regression-profile
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install
        run: npm ci

      - name: Native binding performance gate
        run: npm run bench:bindings

      - name: Upload binding comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: binding-comparison
          path: benchmark/profiles/binding-compare/

  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: binding-performance-gate
    if: success() && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install
        run: npm ci

      - name: Publish
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
